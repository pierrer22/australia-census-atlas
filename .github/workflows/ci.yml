name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main", "live-data"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JS syntax
        run: node --check web/app.js
      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py
      - name: Validate datasets & DOM IDs
        run: python3 scripts/validate_site.py
