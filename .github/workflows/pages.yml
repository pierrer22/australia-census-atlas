name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Overlay latest scheduled API data (if available)
        run: |
          if git fetch --depth=1 origin live-data 2>/dev/null; then
            git checkout FETCH_HEAD -- \
              web/data/recent_incidents.json \
              web/data/nsw_fuel_prices.json \
              web/data/au_ev_chargers.json
            echo "Overlaid latest live-data snapshot."
          else
            echo "No live-data branch yet; using committed snapshots."
          fi
      - name: Validate JS & datasets
        run: |
          node --check web/app.js
          node --check web/fuel.js
          python3 scripts/validate_site.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
