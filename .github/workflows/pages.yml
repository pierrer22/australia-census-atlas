name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh recent police & SA crime pins
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/fetch_recent_incidents.py
      - name: Refresh NSW FuelCheck prices
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NSW_FUEL_API_KEY: ${{ secrets.NSW_FUEL_API_KEY }}
          NSW_FUEL_API_SECRET: ${{ secrets.NSW_FUEL_API_SECRET }}
        run: python3 scripts/fetch_nsw_fuel.py
      - name: Validate JS & datasets
        run: |
          node --check web/app.js
          python3 scripts/validate_site.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
