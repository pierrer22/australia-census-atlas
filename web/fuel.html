<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuel &amp; EV Fast Charger Finder — NSW &amp; Australia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="" />
  <link rel="stylesheet" href="fuel.css?v=11" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="" defer></script>
  <script src="fuel.js?v=28" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Fuel &amp; EV Finder</h1>
          <p class="subtitle" id="fuel-subtitle">Loading live Australian fuel &amp; EV chargers…</p>
        </div>
      </div>

      <div class="nav-controls">
        <div class="mode-switch" id="mode-switch" role="tablist" aria-label="Finder mode">
          <button type="button" class="mode-btn active" data-mode="fuel" role="tab" aria-selected="true">Fuel (NSW/ACT/TAS/WA)</button>
          <button type="button" class="mode-btn" data-mode="ev" role="tab" aria-selected="false">EV Fast Charging</button>
        </div>
        <nav class="sub-tabs" id="sub-tabs" aria-label="Fuel or EV filter"></nav>
      </div>

      <div class="topbar-right">
        <div class="search-wrap">
          <input
            id="station-search"
            type="search"
            placeholder="Search station, suburb, brand..."
            autocomplete="off"
            aria-label="Search station or suburb"
          />
          <div id="station-search-results" class="search-results" hidden></div>
        </div>
        <button id="locate-btn" class="action-btn" type="button" title="Center map on your GPS location">Near Me</button>
        <button id="theme-toggle" class="action-btn" type="button" aria-label="Toggle dark mode">Dark</button>
        <a href="index.html" class="pill-link" title="Back to Australia Census &amp; Election Atlas">← Census Atlas</a>
      </div>
    </header>

    <main class="workspace">
      <section class="map-wrap">
        <div id="map" aria-label="Interactive street map of fuel and EV charging stations"></div>

        <div class="city-jumps" id="city-jumps" role="group" aria-label="Quick city jump"></div>

        <div class="map-legend">
          <div class="legend-title" id="legend-title">E10 / U91 (¢/L)</div>
          <div class="legend-bar" id="legend-bar"></div>
          <div class="legend-ticks mono" id="legend-ticks"></div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-head">
          <div>
            <h2 id="list-title">Stations in View</h2>
            <span class="list-badge mono" id="list-badge">—</span>
          </div>
          <label class="sort-wrap" for="sort-select">
            <span>Sort</span>
            <select id="sort-select" class="sort-select">
              <option value="best">Cheapest / Fastest</option>
              <option value="nearest">Nearest</option>
            </select>
          </label>
        </div>

        <div class="kpi-row" id="kpi-row"></div>
        <div class="station-list" id="station-list"></div>
      </aside>
    </main>
  </div>
</body>
</html>
